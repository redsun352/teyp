name: Build SWAT DSP Inspector APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'swat-dsp-inspector/**'
      - '.github/workflows/build-swat-dsp-inspector.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        working-directory: swat-dsp-inspector
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SWAT-DSP-Inspector-debug
          path: swat-dsp-inspector/app/build/outputs/apk/debug/app-debug.apk
